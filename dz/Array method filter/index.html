<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- html+css has been taken from previous task -->
    <title>Asynchronous JavaScript Exercise</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .filter-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .filter-group {
            background: rgba(255,255,255,0.06);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .filter-group h2 {
            margin-top: 0;
            color: #f39c12;
            font-size: 1.2rem;
        }
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .filter-row label {
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: block;
            color: #ddd;
        }
        .filter-row input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            color: #f1f1f1;
            font-size: 1rem;
        }
        .filter-row input::placeholder {
            color: #999;
        }
        #show-results {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: #f39c12;
            color: #111;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        #show-results:hover {
            background: #e0a23f;
            transform: translateY(-1px);
        }
        #results {
            margin-top: 20px;
            border: 1px solid #333;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
        }
        #results h2 {
            margin-top: 0;
            color: #f39c12;
        }
        .planet-card {
            border: 1px solid #444;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.04);
        }
        .planet-card strong {
            color: #2ecc71;
        }
        .empty-state {
            color: #eee;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Planet Filter</h1>
    <div class="filter-container">
        <section class="filter-group">
            <h2>Temperature filter</h2>
            <div class="filter-row">
                <label for="temp-min">Temp from (K)</label>
                <input id="temp-min" type="number" placeholder="min" min="0">
            </div>
            <div class="filter-row">
                <label for="temp-max">Temp to (K)</label>
                <input id="temp-max" type="number" placeholder="max" min="0">
            </div>
        </section>
        <section class="filter-group">
            <h2>Distance filter</h2>
            <div class="filter-row">
                <label for="dist-min">Distance from Sun (AU) from</label>
                <input id="dist-min" type="number" step="0.01" placeholder="min" min="0">
            </div>
            <div class="filter-row">
                <label for="dist-max">Distance from Sun (AU) to</label>
                <input id="dist-max" type="number" step="0.01" placeholder="max" min="0">
            </div>
        </section>
    </div>
    <button id="show-results">Show results</button>
    <section id="results">
        <h2>Results</h2>
        <div id="results-list">
            <p class="empty-state">Enter filter values and press Show results.</p>
        </div>
    </section>

    <script src="planets.js"></script>
</body>
</html>
