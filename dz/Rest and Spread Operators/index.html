<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- html+css has been taken from previous task -->
    <title>Rest and Spread Operators</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #result {
            text-align: center;
            font-size: 2em;
            color: #2ecc71;
            margin: 30px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 2px solid #f39c12;
        }
        .console-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        #console-output1, #console-output2 {
            background: #0d0d0d;
            border: 2px solid #f39c12;
            border-radius: 5px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }
        #console-output1::before {
            content: "ForEach Exercises";
            display: block;
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f39c12;
        }
        #console-output2::before {
            content: "Map/Filter Exercises";
            display: block;
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f39c12;
        }
        .log-entry { margin: 2px 0; }
        .success { color: #2ecc71; }
        .fail { color: #e74c3c; }
        .info { color: #3498db; }
        .total { color: #f39c12; font-weight: bold; }
        #start-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: 'Courier New', monospace;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        #start-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Rest and Spread Operators</h1>
    <div class="console-container">
        <div id="console-output1"></div>
    </div>
    <script>
        // Capture console.log output
        const outputDiv = document.getElementById('console-output1');
        const originalLog = console.log;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            const output = args.map(arg => {
                if (typeof arg === 'object') {
                    return JSON.stringify(arg);
                }
                return String(arg);
            }).join(' ');
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry success';
            logEntry.textContent = '→ ' + output;
            outputDiv.appendChild(logEntry);
        };
    </script>
    <script type="text/javascript" src="./wildlife.js"></script>
</body>
</html>
